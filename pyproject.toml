[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "us-trading-bot"
version = "0.1.0"
description = "Autonomous algorithmic trading system for US/Canadian equities via Interactive Brokers"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Trading Bot Dev"},
]

dependencies = [
    "yfinance>=0.2.36",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Live Interactive Brokers trading (requires a running TWS/Gateway).
# The default paper broker needs none of this, so it is kept optional.
live = [
    "ib_insync>=0.9.86",
]
# Alpaca market-data provider with websocket streaming (MARKET_DATA_PROVIDER=alpaca).
# The default yfinance provider needs none of this, so it is kept optional.
alpaca = [
    "alpaca-py>=0.20",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "short_strategies/tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = [
    "config*",
    "data*",
    "alerts*",
    "signals*",
    "ai*",
    "risk*",
    "execution*",
    "journal*",
    "agent*",
    "tools*",
    "dashboard*",
    "analytics*",
    "backtest*",
    "short_strategies*",
]
