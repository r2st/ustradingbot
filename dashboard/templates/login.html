<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0B">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<title>Sign in · DoAide Trade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script defer src="https://analytics.doaide.com/script.js" data-website-id="32893208-8775-4a86-937f-4542984e7a7e"></script>
<style>
  :root {
    --bg: #0A0A0B;
    --surface: rgba(16, 16, 18, 0.8);
    --border: rgba(255, 255, 255, 0.07);
    --border-focus: rgba(255, 255, 255, 0.12);
    --text: #FFFFFF;
    --text-body: rgba(255, 255, 255, 0.8);
    --text-muted: rgba(255, 255, 255, 0.45);
    --text-dim: rgba(255, 255, 255, 0.35);
    --accent: #F0B429;
    --accent-hover: #D9A326;
    --red: #EF4444;
    --green: #22C55E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Schibsted Grotesk", ui-sans-serif, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text-body);
    line-height: 1.6;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .login-wrap { width: 100%; max-width: 400px; text-align: center; }

  .robot-logo {
    display: block; margin: 0 auto 20px; width: 48px; height: 48px;
    color: var(--accent);
  }

  .brand-heading {
    font-family: "Instrument Serif", Georgia, serif;
    font-size: 42px; font-weight: 400; letter-spacing: -1.68px;
    color: var(--text); margin-bottom: 8px;
  }
  .brand-heading .brand-accent { color: var(--accent); }

  .brand-sub {
    font-size: 14px; color: var(--text-muted);
    margin-bottom: 28px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.4), 0 2px 6px rgba(0, 0, 0, 0.2);
  }

  label {
    display: block;
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
    font-size: 10px; font-weight: 400; letter-spacing: 1.8px;
    text-transform: uppercase; color: var(--text-dim);
    margin-bottom: 6px; text-align: left;
  }
  .field { margin-bottom: 16px; }
  input[type="text"], input[type="password"] {
    width: 100%; padding: 10px 14px;
    background: rgba(10, 10, 11, 0.6); color: var(--text);
    border: 1px solid var(--border-focus); border-radius: 8px;
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
    font-size: 14px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input::placeholder { color: var(--text-dim); }
  input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(240, 180, 41, 0.15);
  }
  .btn {
    width: 100%; padding: 10px 16px; margin-top: 4px;
    background: var(--accent); color: var(--bg);
    border: none; border-radius: 8px;
    font-family: "Schibsted Grotesk", ui-sans-serif, system-ui, sans-serif;
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: background .15s ease, transform .12s ease;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .alert {
    display: flex; gap: 9px; align-items: flex-start;
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: var(--text-body);
    border-radius: 8px; padding: 10px 12px; font-size: 13px;
    margin-bottom: 16px; text-align: left;
  }
  .alert .ico { color: var(--red); font-weight: 700; line-height: 1.4; }

  .foot {
    margin-top: 18px; text-align: center;
    font-size: 14px; color: var(--text-dim);
  }

  @media (prefers-reduced-motion: reduce) {
    input, .btn { transition: none; }
    .btn:active { transform: none; }
  }
</style>
</head>
<body>
<main class="login-wrap">
  <!-- DoAide robot logo -->
  <svg class="robot-logo" viewBox="0 0 32 32" aria-hidden="true">
    <line x1="16" y1="6" x2="16" y2="2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="16" cy="1.5" r="1.5" fill="currentColor"/>
    <rect x="5" y="6" width="22" height="17" rx="5" fill="currentColor"/>
    <ellipse cx="11" cy="13" rx="2.5" ry="3" fill="#0A0A0B"/>
    <ellipse cx="21" cy="13" rx="2.5" ry="3" fill="#0A0A0B"/>
    <circle cx="11.5" cy="12.5" r="1" fill="currentColor" opacity="0.6"/>
    <circle cx="21.5" cy="12.5" r="1" fill="currentColor" opacity="0.6"/>
    <path d="M12 19Q16 22 20 19" stroke="#0A0A0B" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <rect x="1" y="10" width="4" height="5" rx="2" fill="currentColor" opacity="0.8"/>
    <rect x="27" y="10" width="4" height="5" rx="2" fill="currentColor" opacity="0.8"/>
  </svg>

  <h1 class="brand-heading">DoAide <span class="brand-accent">Trade</span></h1>
  <p class="brand-sub">Automated equity trading, powered by AI.</p>

  <div class="card">
    {% if error %}
    <div class="alert" role="alert">
      <span class="ico" aria-hidden="true">!</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="post" action="/login" autocomplete="on">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username"
               autocapitalize="none" spellcheck="false" required autofocus
               placeholder="you@example.com"
               value="{{ username|default('', true) }}">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               autocomplete="current-password" required
               placeholder="••••••••">
      </div>
      <button type="submit" class="btn">Sign in</button>
    </form>
  </div>

  <p class="foot">DoAide Trade</p>
</main>
{% include "feedback_widget.html" %}
</body>
</html>
