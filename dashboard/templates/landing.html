<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0B">
<title>DoAide Trade — US stock trading, simplified.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #0A0A0B;
  --surface: rgba(16, 16, 18, 0.8);
  --border: rgba(255, 255, 255, 0.07);
  --border-focus: rgba(255, 255, 255, 0.12);
  --text: #FFFFFF;
  --text-body: rgba(255, 255, 255, 0.8);
  --text-muted: rgba(255, 255, 255, 0.45);
  --text-dim: rgba(255, 255, 255, 0.35);
  --accent: #F0B429;
  --accent-hover: #D9A326;
  --accent-secondary: #F7CC5F;
  --red: #EF4444;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Schibsted Grotesk", ui-sans-serif, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text-body);
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Particle Background ── */
.particles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.particle {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0;
  animation: particle-float linear infinite;
}

@keyframes particle-float {
  0% { opacity: 0; transform: translateY(0) scale(0.5); }
  10% { opacity: 0.4; }
  90% { opacity: 0.1; }
  100% { opacity: 0; transform: translateY(-100vh) scale(1); }
}

/* ── Header ── */
.header {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  padding: 20px 32px;
  max-width: 1200px;
  margin: 0 auto;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--text);
}

.brand-text {
  font-family: "Schibsted Grotesk", sans-serif;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.3px;
}

.brand-accent { color: var(--accent); }

/* ── Main Split Layout ── */
.main-container {
  position: relative;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 48px;
  max-width: 1200px;
  margin: 0 auto;
  padding: 40px 32px 40px;
  min-height: calc(100vh - 160px);
}

.left-panel {
  flex: 1 1 55%;
  max-width: 620px;
}

.right-panel {
  flex: 0 0 400px;
  width: 400px;
}

/* ── Robot Mascot ── */
.robot-wrap {
  margin-bottom: 32px;
  animation: robot-float 4s ease-in-out infinite;
  filter: drop-shadow(0 0 40px rgba(240, 180, 41, 0.25));
}

@keyframes robot-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

@keyframes antenna-pulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

.antenna-glow {
  animation: antenna-pulse 2s ease-in-out infinite;
}

/* ── Headline ── */
.headline {
  font-family: "Instrument Serif", Georgia, serif;
  font-size: 56px;
  font-weight: 400;
  letter-spacing: -2px;
  line-height: 1.1;
  color: var(--text);
  margin-bottom: 16px;
}

/* ── Subtitle ── */
.subtitle {
  font-family: "IBM Plex Mono", monospace;
  font-size: 15px;
  font-weight: 400;
  color: var(--text-muted);
  margin-bottom: 28px;
  line-height: 1.5;
}

/* ── Typewriter ── */
.typewriter-line {
  font-family: "IBM Plex Mono", monospace;
  font-size: 14px;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 4px;
  height: 22px;
}

.typewriter-prefix {
  color: var(--text-dim);
}

.typewriter-text {
  color: var(--accent-secondary);
}

.typewriter-cursor {
  display: inline-block;
  width: 2px;
  height: 16px;
  background: var(--accent);
  animation: cursor-blink 0.8s step-end infinite;
  vertical-align: middle;
}

@keyframes cursor-blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* ── Login Card ── */
.login-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 32px;
  backdrop-filter: blur(20px);
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4), 0 2px 8px rgba(0, 0, 0, 0.2);
}

/* ── Tabs ── */
.tabs {
  display: flex;
  gap: 0;
  margin-bottom: 28px;
  border-bottom: 1px solid var(--border);
}

.tab {
  flex: 1;
  padding: 10px 0;
  background: none;
  border: none;
  font-family: "Schibsted Grotesk", sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-dim);
  cursor: pointer;
  transition: color 0.2s;
  position: relative;
}

.tab:hover { color: var(--text-muted); }

.tab.active {
  color: var(--text);
}

.tab.active::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--accent);
  border-radius: 1px;
}

/* ── Form ── */
label {
  display: block;
  font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 6px;
}

.field { margin-bottom: 16px; }

input[type="text"],
input[type="password"] {
  width: 100%;
  padding: 10px 14px;
  background: rgba(10, 10, 11, 0.6);
  color: var(--text);
  border: 1px solid var(--border-focus);
  border-radius: 8px;
  font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
  font-size: 14px;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

input::placeholder { color: var(--text-dim); }

input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(240, 180, 41, 0.15);
}

.btn {
  width: 100%;
  padding: 10px 16px;
  margin-top: 4px;
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: 8px;
  font-family: "Schibsted Grotesk", ui-sans-serif, system-ui, sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.12s ease;
}

.btn:hover { background: var(--accent-hover); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── Alert ── */
.alert {
  display: flex;
  gap: 9px;
  align-items: flex-start;
  background: rgba(239, 68, 68, 0.12);
  border: 1px solid rgba(239, 68, 68, 0.4);
  color: var(--text-body);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 13px;
  margin-bottom: 16px;
  text-align: left;
}

.alert .ico { color: var(--red); font-weight: 700; line-height: 1.4; }

/* ── Footer ── */
.footer {
  position: relative;
  z-index: 5;
  padding: 32px 32px 20px;
  border-top: 1px solid var(--border);
  max-width: 1200px;
  margin: 0 auto;
}

.footer-products {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px 16px;
  margin-bottom: 16px;
}

.footer-link {
  color: var(--text-muted);
  font-size: 12px;
  text-decoration: none;
  transition: color 0.2s;
}

.footer-link:hover { color: var(--accent); }

.footer-bottom {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
}

.footer-home {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-muted);
  font-size: 12px;
  text-decoration: none;
  transition: color 0.2s;
}

.footer-home:hover { color: var(--accent); }

.footer-copy {
  color: var(--text-muted);
  font-size: 12px;
}

/* ── Pipeline Visualization ── */
.pipeline {
  margin: 28px 0 24px;
  overflow: visible;
}

.pipeline svg {
  display: block;
  width: 100%;
  max-width: 480px;
  height: auto;
}

.pipeline-node-bg {
  fill: rgba(16, 16, 18, 0.8);
  stroke: rgba(255, 255, 255, 0.07);
  stroke-width: 1;
}

.pipeline-icon {
  fill: none;
  stroke: #F0B429;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.pipeline-icon-fill { fill: #F0B429; }

.pipeline-label {
  fill: rgba(255, 255, 255, 0.6);
  font-family: "IBM Plex Mono", monospace;
  font-size: 9px;
  letter-spacing: 0.8px;
  text-anchor: middle;
}

.pipeline-connector {
  stroke: rgba(240, 180, 41, 0.15);
  stroke-width: 1.5;
  fill: none;
}

.pipeline-dot {
  fill: #F0B429;
  filter: url(#pipeline-glow);
}

.pipeline-dot-1 { animation: pipe-flow-1 3s ease-in-out infinite; }
.pipeline-dot-2 { animation: pipe-flow-2 3s ease-in-out 1s infinite; }
.pipeline-dot-3 { animation: pipe-flow-3 3s ease-in-out 2s infinite; }

@keyframes pipe-flow-1 {
  0%   { opacity: 0; offset-distance: 0%; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { opacity: 0; offset-distance: 100%; }
}

@keyframes pipe-flow-2 {
  0%   { opacity: 0; offset-distance: 0%; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { opacity: 0; offset-distance: 100%; }
}

@keyframes pipe-flow-3 {
  0%   { opacity: 0; offset-distance: 0%; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { opacity: 0; offset-distance: 100%; }
}

.pipeline-node-glow {
  fill: none;
  stroke: rgba(240, 180, 41, 0.08);
  stroke-width: 1;
  animation: node-glow-pulse 4s ease-in-out infinite;
}

.pipeline-node-glow:nth-child(2) { animation-delay: 1s; }
.pipeline-node-glow:nth-child(3) { animation-delay: 2s; }
.pipeline-node-glow:nth-child(4) { animation-delay: 3s; }

@keyframes node-glow-pulse {
  0%, 100% { stroke: rgba(240, 180, 41, 0.06); }
  50% { stroke: rgba(240, 180, 41, 0.2); }
}

/* ── Responsive ── */
@media (max-width: 900px) {
  .main-container {
    flex-direction: column;
    gap: 32px;
    padding: 24px 16px;
    min-height: auto;
  }
  .left-panel {
    text-align: center;
    max-width: 100%;
  }
  .robot-wrap {
    display: flex;
    justify-content: center;
  }
  .typewriter-line {
    justify-content: center;
  }
  .headline {
    font-size: 40px;
  }
  .pipeline svg {
    margin: 0 auto;
  }
  .right-panel {
    flex: none;
    width: 100%;
    max-width: 400px;
  }
  .header { padding: 16px; }
  .footer { padding: 24px 16px 16px; }
}

@media (max-width: 480px) {
  .headline { font-size: 32px; }
  .login-card { padding: 24px 20px; border-radius: 20px; }
}

/* ── Reduced Motion ── */
@media (prefers-reduced-motion: reduce) {
  .particle, .robot-wrap, .antenna-glow, .typewriter-cursor,
  .pipeline-dot, .pipeline-dot-1, .pipeline-dot-2, .pipeline-dot-3,
  .pipeline-node-glow {
    animation: none !important;
  }
  .particle { display: none; }
  .pipeline-dot { opacity: 0.6; }
  .pipeline-node-glow { stroke: rgba(240, 180, 41, 0.12); }
}
</style>
</head>
<body>

<!-- Particle background -->
<div class="particles" id="particles"></div>

<!-- Header -->
<header class="header">
  <a href="https://doaide.com" class="brand">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="32" height="32" aria-hidden="true">
      <g fill="none">
        <line x1="24" y1="8" x2="24" y2="3" stroke="#F0B429" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="24" cy="2" r="1.8" fill="#F0B429" opacity="0.9"/>
        <circle cx="24" cy="2" r="2.8" fill="#F0B429" opacity="0.25"/>
        <rect x="14" y="8" width="20" height="14" rx="4" fill="#F0B429"/>
        <circle cx="19.5" cy="14" r="2.2" fill="#0A0A0B"/>
        <circle cx="28.5" cy="14" r="2.2" fill="#0A0A0B"/>
        <path d="M20 18.5 Q24 21.5 28 18.5" stroke="#0A0A0B" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <rect x="16" y="23" width="16" height="12" rx="3" fill="#F0B429"/>
        <rect x="8" y="24" width="7" height="3.5" rx="1.8" fill="#F0B429"/>
        <rect x="33" y="24" width="7" height="3.5" rx="1.8" fill="#F0B429"/>
        <rect x="19" y="36" width="3.5" height="5" rx="1.5" fill="#F0B429"/>
        <rect x="25.5" y="36" width="3.5" height="5" rx="1.5" fill="#F0B429"/>
      </g>
    </svg>
    <span class="brand-text">Do<span class="brand-accent">Aide</span> Trade</span>
  </a>
</header>

<!-- Main split layout -->
<main class="main-container">
  <!-- Left: product info -->
  <div class="left-panel">
    <div class="robot-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 120" width="140" height="120">
        <line x1="70" y1="18" x2="70" y2="6" stroke="#F0B429" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="70" cy="4" r="3.5" fill="#F0B429" class="antenna-glow"/>
        <circle cx="70" cy="4" r="5" fill="#F0B429" opacity="0.2" class="antenna-glow"/>
        <rect x="30" y="18" width="80" height="58" rx="18" fill="#F0B429"/>
        <ellipse cx="50" cy="42" rx="9" ry="11" fill="#0A0A0B"/>
        <ellipse cx="90" cy="42" rx="9" ry="11" fill="#0A0A0B"/>
        <circle cx="52" cy="40" r="3.5" fill="#F0B429" opacity="0.45"/>
        <circle cx="92" cy="40" r="3.5" fill="#F0B429" opacity="0.45"/>
        <path d="M54 62 Q70 76 86 62" stroke="#0A0A0B" stroke-width="2.8" fill="none" stroke-linecap="round"/>
        <rect x="8" y="32" width="18" height="20" rx="7" fill="#F0B429" opacity="0.8"/>
        <rect x="114" y="32" width="18" height="20" rx="7" fill="#F0B429" opacity="0.8"/>
        <rect x="42" y="78" width="22" height="16" rx="5" fill="#F0B429"/>
        <rect x="76" y="78" width="22" height="16" rx="5" fill="#F0B429"/>
        <rect x="46" y="96" width="6" height="10" rx="3" fill="#F0B429"/>
        <rect x="88" y="96" width="6" height="10" rx="3" fill="#F0B429"/>
        <!-- Briefcase on arm -->
        <g transform="translate(122, 44)">
          <rect x="-3" y="0" width="9" height="7" rx="1.2" fill="#0A0A0B" stroke="#F0B429" stroke-width="0.8"/>
          <path d="M0 0 v-1.5 a1.5 1.5 0 0 1 1.5-1.5 h0 a1.5 1.5 0 0 1 1.5 1.5 v1.5" stroke="#F0B429" stroke-width="0.7" fill="none"/>
          <rect x="0.5" y="2.5" width="2" height="1.2" rx="0.4" fill="#F0B429"/>
        </g>
      </svg>
    </div>

    <h1 class="headline">US stock trading, simplified.</h1>
    <p class="subtitle">AI-powered market analysis and trading signals for US equities.</p>

    <!-- Pipeline visualization -->
    <div class="pipeline" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 72">
        <defs>
          <filter id="pipeline-glow">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <!-- Connector paths for dot motion -->
          <path id="conn-1" d="M100,36 L140,36"/>
          <path id="conn-2" d="M220,36 L260,36"/>
          <path id="conn-3" d="M340,36 L380,36"/>
        </defs>

        <!-- Connector lines -->
        <line x1="100" y1="36" x2="140" y2="36" class="pipeline-connector"/>
        <line x1="220" y1="36" x2="260" y2="36" class="pipeline-connector"/>
        <line x1="340" y1="36" x2="380" y2="36" class="pipeline-connector"/>

        <!-- Node 1: Scan -->
        <rect class="pipeline-node-glow" x="18" y="10" width="82" height="52" rx="12"/>
        <rect class="pipeline-node-bg" x="20" y="12" width="78" height="48" rx="11"/>
        <g transform="translate(46, 24)">
          <!-- Radar icon -->
          <circle cx="13" cy="10" r="9" class="pipeline-icon" stroke-width="1.2"/>
          <path d="M13 10 L13 1" class="pipeline-icon" stroke-width="1.3"/>
          <path d="M13 10 L20 5" class="pipeline-icon" stroke-width="1.3"/>
          <circle cx="13" cy="10" r="2" class="pipeline-icon-fill"/>
          <path d="M18 3 A9 9 0 0 1 22 10" class="pipeline-icon" stroke-width="1" opacity="0.5"/>
        </g>
        <text class="pipeline-label" x="59" y="62">SCAN</text>

        <!-- Node 2: Analyze -->
        <rect class="pipeline-node-glow" x="138" y="10" width="82" height="52" rx="12"/>
        <rect class="pipeline-node-bg" x="140" y="12" width="78" height="48" rx="11"/>
        <g transform="translate(166, 24)">
          <!-- Brain/AI icon -->
          <path d="M6 14 C6 6, 13 2, 13 8 C13 2, 20 6, 20 14" class="pipeline-icon" stroke-width="1.3"/>
          <path d="M9 8 Q13 12 17 8" class="pipeline-icon" stroke-width="1" opacity="0.6"/>
          <path d="M8 11 L10 11" class="pipeline-icon" stroke-width="1.2"/>
          <path d="M16 11 L18 11" class="pipeline-icon" stroke-width="1.2"/>
          <circle cx="13" cy="14" r="1.5" class="pipeline-icon-fill" opacity="0.7"/>
          <path d="M10 16 L16 16" class="pipeline-icon" stroke-width="1"/>
        </g>
        <text class="pipeline-label" x="179" y="62">ANALYZE</text>

        <!-- Node 3: Signal -->
        <rect class="pipeline-node-glow" x="258" y="10" width="82" height="52" rx="12"/>
        <rect class="pipeline-node-bg" x="260" y="12" width="78" height="48" rx="11"/>
        <g transform="translate(284, 23)">
          <!-- Lightning bolt icon -->
          <polygon points="14,1 7,11 12,11 9,20 18,9 13,9" class="pipeline-icon-fill" opacity="0.9"/>
          <polygon points="14,1 7,11 12,11 9,20 18,9 13,9" class="pipeline-icon" stroke-width="0.8"/>
        </g>
        <text class="pipeline-label" x="299" y="62">SIGNAL</text>

        <!-- Node 4: Execute -->
        <rect class="pipeline-node-glow" x="378" y="10" width="82" height="52" rx="12"/>
        <rect class="pipeline-node-bg" x="380" y="12" width="78" height="48" rx="11"/>
        <g transform="translate(406, 24)">
          <!-- Target/crosshair icon -->
          <circle cx="13" cy="10" r="8" class="pipeline-icon" stroke-width="1.2"/>
          <circle cx="13" cy="10" r="4" class="pipeline-icon" stroke-width="1"/>
          <circle cx="13" cy="10" r="1.5" class="pipeline-icon-fill"/>
          <line x1="13" y1="1" x2="13" y2="5" class="pipeline-icon" stroke-width="1"/>
          <line x1="13" y1="15" x2="13" y2="19" class="pipeline-icon" stroke-width="1"/>
          <line x1="4" y1="10" x2="8" y2="10" class="pipeline-icon" stroke-width="1"/>
          <line x1="18" y1="10" x2="22" y2="10" class="pipeline-icon" stroke-width="1"/>
        </g>
        <text class="pipeline-label" x="419" y="62">EXECUTE</text>

        <!-- Flowing dots along connectors -->
        <circle r="2.5" class="pipeline-dot pipeline-dot-1" style="offset-path:path('M100,36 L140,36')"/>
        <circle r="2.5" class="pipeline-dot pipeline-dot-2" style="offset-path:path('M220,36 L260,36')"/>
        <circle r="2.5" class="pipeline-dot pipeline-dot-3" style="offset-path:path('M340,36 L380,36')"/>
      </svg>
    </div>

    <div class="typewriter-line">
      <span class="typewriter-prefix">&gt;</span>
      <span class="typewriter-text" id="typewriter"></span>
      <span class="typewriter-cursor"></span>
    </div>
  </div>

  <!-- Right: login/register form -->
  <div class="right-panel">
    <div class="login-card">
      <div class="tabs">
        <button class="tab active" id="tab-signin" type="button">Sign in</button>
        <button class="tab" id="tab-create" type="button">Create account</button>
      </div>

      {% if error %}
      <div class="alert" role="alert">
        <span class="ico" aria-hidden="true">!</span>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="post" action="/login" autocomplete="on">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username"
                 autocapitalize="none" spellcheck="false" required autofocus
                 placeholder="you@example.com"
                 value="{{ username|default('', true) }}">
        </div>
        <div class="field">
          <label for="password">Password</label>

<script>
// Typewriter effect
(function() {
  var phrases = [
    "AI market analysis",
    "Smart trading signals",
    "Real-time insights",
    "Portfolio optimization"
  ];
  var el = document.getElementById("typewriter");
  if (!el) return;
  var phraseIdx = 0, charIdx = 0, deleting = false;
  var typeSpeed = 80, deleteSpeed = 40, pauseEnd = 2000, pauseStart = 400;

  function tick() {
    var phrase = phrases[phraseIdx];
    if (!deleting) {
      el.textContent = phrase.substring(0, charIdx + 1);
      charIdx++;
      if (charIdx >= phrase.length) {
        deleting = true;
        setTimeout(tick, pauseEnd);
        return;
      }
      setTimeout(tick, typeSpeed);
    } else {
      el.textContent = phrase.substring(0, charIdx);
      charIdx--;
      if (charIdx < 0) {
        deleting = false;
        charIdx = 0;
        phraseIdx = (phraseIdx + 1) % phrases.length;
        setTimeout(tick, pauseStart);
        return;
      }
      setTimeout(tick, deleteSpeed);
    }
  }
  setTimeout(tick, 600);
})();

// Tab switching (visual only — both tabs use the same form)
(function() {
  var tabSignin = document.getElementById("tab-signin");
  var tabCreate = document.getElementById("tab-create");
  var btn = document.getElementById("submit-btn");
  if (!tabSignin || !tabCreate || !btn) return;

  tabSignin.addEventListener("click", function() {
    tabSignin.classList.add("active");
    tabCreate.classList.remove("active");
    btn.textContent = "Sign in";
  });
  tabCreate.addEventListener("click", function() {
    tabCreate.classList.add("active");
    tabSignin.classList.remove("active");
    btn.textContent = "Create account";
  });
})();

// Particle background
(function() {
  var container = document.getElementById("particles");
  if (!container) return;
  var motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
  if (motionQuery.matches) return;
  for (var i = 0; i < 30; i++) {
    var p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random() * 100 + "%";
    p.style.top = (80 + Math.random() * 30) + "%";
    p.style.width = (1.5 + Math.random() * 2.5) + "px";
    p.style.height = p.style.width;
    p.style.animationDuration = (8 + Math.random() * 14) + "s";
    p.style.animationDelay = (Math.random() * 10) + "s";
    container.appendChild(p);
  }
})();
</script>
