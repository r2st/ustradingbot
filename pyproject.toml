[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "us-trading-bot"
version = "0.1.0"
description = "Autonomous algorithmic trading system for US/Canadian equities via Interactive Brokers"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Trading Bot Dev"},
]

dependencies = [
    "ib_insync>=0.9.86",
    "yfinance>=0.2.36",
    "pandas>=2.2",
    "numpy>=1.26",
    "anthropic>=0.50",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "ta>=0.11",
    "schedule>=1.2",
    "python-telegram-bot>=21.0",
    "aiofiles>=23.2",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = [
    "config*",
    "data*",
    "signals*",
    "ai*",
    "risk*",
    "execution*",
    "journal*",
    "agent*",
    "tools*",
    "dashboard*",
]
