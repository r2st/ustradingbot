<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · USTradingBot</title>
<script>
  // Match the dashboard's theme choice so the login screen does not flash a
  // different palette than the app the user is about to enter.
  (function () {
    try {
      var t = localStorage.getItem("ustb_theme");
      if (!t && window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: light)").matches) t = "light";
      if (t === "light") document.documentElement.setAttribute("data-theme", "light");
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg: #0F172A;
    --bg-grad: linear-gradient(160deg, #0F172A 0%, #1E293B 100%);
    --surface: #1E293B;
    --surface-2: #334155;
    --border: #334155;
    --text: #F8FAFC;
    --text-muted: #94A3B8;
    --accent: #3B82F6;
    --accent-dim: #1E40AF;
    --green: #22C55E;
    --red: #EF4444;
  }
  :root[data-theme="light"] {
    --bg: #f4f6fb;
    --bg-grad: linear-gradient(160deg, #f4f6fb 0%, #e8edf7 100%);
    --surface: #ffffff;
    --surface-2: #eef1f8;
    --border: #d3d9e6;
    --text: #1a1d27;
    --text-muted: #5c6270;
    --accent: #2d6cdf;
    --accent-dim: #7ba7ec;
    --green: #1a9e54;
    --red: #d63b2a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    background: var(--bg-grad);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .login-wrap { width: 100%; max-width: 400px; }

  .brand {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-bottom: 22px;
  }
  .brand .wordmark { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  .brand .wm-us { color: var(--accent); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 26px;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.34), 0 2px 6px rgba(0, 0, 0, 0.2);
  }
  :root[data-theme="light"] .card {
    box-shadow: 0 12px 32px rgba(26, 29, 39, 0.10), 0 1px 3px rgba(26, 29, 39, 0.06);
  }
  .card h1 { font-size: 19px; font-weight: 650; margin-bottom: 4px; }
  .card .sub { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }

  label {
    display: block; font-size: 12px; font-weight: 600; letter-spacing: .3px;
    text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px;
  }
  .field { margin-bottom: 15px; }
  input[type="text"], input[type="password"] {
    width: 100%; padding: 11px 13px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; font-family: inherit;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
  }
  .btn {
    width: 100%; padding: 11px 16px; margin-top: 4px;
    background: var(--accent); color: #fff;
    border: 1px solid var(--accent); border-radius: 8px;
    font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
    transition: background .15s ease, transform .12s ease;
  }
  .btn:hover { background: var(--accent-dim); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .alert {
    display: flex; gap: 9px; align-items: flex-start;
    background: color-mix(in srgb, var(--red) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--red) 40%, transparent);
    color: var(--text);
    border-radius: 8px; padding: 10px 12px; font-size: 13px;
    margin-bottom: 16px;
  }
  .alert .ico { color: var(--red); font-weight: 700; line-height: 1.4; }

  .foot {
    margin-top: 18px; text-align: center;
    font-size: 12px; color: var(--text-muted);
  }
  .foot .dot { opacity: .5; margin: 0 6px; }

  @media (prefers-reduced-motion: reduce) {
    input, .btn { transition: none; }
    .btn:active { transform: none; }
  }
</style>
</head>
<body>
<main class="login-wrap">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="30" height="30" role="img" aria-label="US Trading Bot logo">
      <title>Bull Circuit</title>
      <path d="M7 13 C4 9 5 5.5 9 7" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
      <path d="M25 13 C28 9 27 5.5 23 7" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
      <path d="M9 7 C9 11 8.5 13 10 15.5 C11.6 18.2 14 20 16 20 C18 20 20.4 18.2 22 15.5 C23.5 13 23 11 23 7"
            fill="none" stroke="#3B82F6" stroke-width="2" stroke-linejoin="round"/>
      <polyline points="10.5 15 13.5 12.4 16.5 14 21 9" fill="none" stroke="#22C55E"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="9" cy="7" r="1.7" fill="#22C55E"/>
      <circle cx="23" cy="7" r="1.7" fill="#22C55E"/>
      <circle cx="21" cy="9" r="1.6" fill="#22C55E"/>
      <circle cx="10.5" cy="15" r="1.5" fill="#EF4444"/>
    </svg>
    <span class="wordmark"><span class="wm-us">US</span>TradingBot</span>
  </div>

  <div class="card">
    <h1>Sign in</h1>
    <p class="sub">Enter your dashboard credentials to continue.</p>

    {% if error %}
    <div class="alert" role="alert">
      <span class="ico" aria-hidden="true">!</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="post" action="/login" autocomplete="on">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username"
               autocapitalize="none" spellcheck="false" required autofocus
               value="{{ username|default('', true) }}">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn">Sign in</button>
    </form>
  </div>

  <p class="foot">
    USTradingBot<span class="dot">·</span>Automated equity trading
  </p>
</main>
</body>
</html>
