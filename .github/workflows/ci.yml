name: CI

# Audit item O1 — run the test suite and a focused lint on every push to main
# and on every pull request.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: pip-${{ matrix.python-version }}-

      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          # Runtime deps plus the dev extras (pytest, pytest-cov, ruff).
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          . .venv/bin/activate
          ruff check .

      - name: Run tests with coverage
        env:
          # Keep the suite hermetic on CI: never read a developer .env / keys/.
          USTB_SKIP_KEY_FILES: "1"
          RATE_LIMIT_ENABLED: "False"
        run: |
          . .venv/bin/activate
          python -m pytest tests/ \
            --cov=. --cov-report=term-missing --cov-report=xml \
            -q

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
